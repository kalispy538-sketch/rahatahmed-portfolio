
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio Admin | Rahat Ahmed</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 25px #00000012;
    }

    h1 {
      margin-top: 0;
      color: #1e3a8a;
    }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 17px;
      font-weight: bold;
    }

    input, select, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: white;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: #475569;
    }

    #uploadSection {
      display: none;
    }

    #status {
      overflow-wrap: anywhere;
      margin-top: 18px;
    }

    .note {
      padding: 12px;
      background: #eff6ff;
      border-radius: 7px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>Portfolio Admin</h1>
    <p>Rahat Ahmed — Manage your portfolio projects.</p>

    <!-- ADMIN LOGIN -->
    <section id="loginSection">
      <h2>Admin Login</h2>

      <label for="email">Admin Email</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your admin email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button id="loginBtn" type="button">Login</button>

      <p class="note">
        Login with the account you created in Supabase Authentication.
      </p>
    </section>

    <!-- PROJECT UPLOAD -->
    <section id="uploadSection">
      <h2>Upload New Project</h2>

      <label for="title">Project Title</label>
      <input
        id="title"
        type="text"
        placeholder="Example: Excel Sales Dashboard"
        required
      >

      <label for="category">Project Category</label>
      <select id="category">
        <option value="AI Development">AI Development</option>
        <option value="Excel">Excel</option>
        <option value="Google Sheets">Google Sheets</option>
        <option value="Data Entry">Data Entry</option>
        <option value="Graphic Design">Graphic Design</option>
        <option value="Video Editing">Video Editing</option>
      </select>

      <label for="description">Project Description</label>
      <textarea
        id="description"
        placeholder="Describe what you created and the skills you used."
      ></textarea>

      <label for="projectFile">Select Project File</label>
      <input
        id="projectFile"
        type="file"
        accept="image/jpeg,image/png,image/webp,video/mp4,application/pdf"
        required
      >

      <p class="note">
        Allowed files: JPG, PNG, WEBP, MP4 and PDF.
        Maximum file size: 50 MB.
      </p>

      <button id="uploadBtn" type="button">Upload Project</button>
      <button id="logoutBtn" class="secondary" type="button">Logout</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    // SUPABASE CONNECTION
    const SUPABASE_URL =
      "https://inaazsmabgptpjckugwn.supabase.co";

   const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_yBaRrATND_tJx4JXsIPAyA__LggH--V";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginSection = document.getElementById("loginSection");
    const uploadSection = document.getElementById("uploadSection");
    const statusBox = document.getElementById("status");

    function showStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.style.color = isError ? "#b91c1c" : "#166534";
    }

    // CHECK LOGIN SESSION
    async function updateScreen() {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        showStatus(error.message, true);
        return;
      }

      const loggedIn = Boolean(data.session);

      loginSection.style.display = loggedIn ? "none" : "block";
      uploadSection.style.display = loggedIn ? "block" : "none";
    }

    // ADMIN LOGIN
    document.getElementById("loginBtn").addEventListener(
      "click",
      async () => {
        const button = document.getElementById("loginBtn");

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!email || !password) {
          showStatus("Enter your email and password.", true);
          return;
        }

        button.disabled = true;
        showStatus("Logging in...");

        try {
          const { error } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

          if (error) throw error;

          document.getElementById("password").value = "";

          await updateScreen();
          showStatus("Login successful.");
        } catch (error) {
          showStatus(error.message || "Login failed.", true);
        } finally {
          button.disabled = false;
        }
      }
    );

    // UPLOAD PROJECT
    document.getElementById("uploadBtn").addEventListener(
      "click",
      async () => {
        const button = document.getElementById("uploadBtn");
        button.disabled = true;

        let uploadedFilePath = null;

        try {
          const { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();

          if (sessionError) throw sessionError;

          if (!sessionData.session) {
            throw new Error("Please log in first.");
          }

          const title =
            document.getElementById("title").value.trim();

          const category =
            document.getElementById("category").value;

          const description =
            document.getElementById("description").value.trim();

          const file =
            document.getElementById("projectFile").files[0];

          if (!title) {
            throw new Error("Please enter a project title.");
          }

          if (!file) {
            throw new Error("Please select a project file.");
          }

          if (file.size > 50 * 1024 * 1024) {
            throw new Error("File must be 50 MB or smaller.");
          }

          const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "video/mp4",
            "application/pdf"
          ];

          if (!allowedTypes.includes(file.type)) {
            throw new Error(
              "Only JPG, PNG, WEBP, MP4 and PDF files are allowed."
            );
          }

          showStatus("Uploading project file...");

          const safeName = file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

          uploadedFilePath =
            `${crypto.randomUUID()}-${safeName}`;

          const { error: uploadError } =
            await supabaseClient.storage
              .from("portfolio-projects")
              .upload(uploadedFilePath, file, {
                cacheControl: "3600",
                upsert: false,
                contentType: file.type
              });

          if (uploadError) throw uploadError;

          const { data: urlData } =
            supabaseClient.storage
              .from("portfolio-projects")
              .getPublicUrl(uploadedFilePath);

          showStatus("Saving project details...");

          const { error: insertError } =
            await supabaseClient
              .from("projects")
              .insert({
                title: title,
                category: category,
                description: description,
                file_url: urlData.publicUrl
              });

          if (insertError) {
            throw new Error(
              "File uploaded but project details could not be saved: " +
              insertError.message
            );
          }

          document.getElementById("title").value = "";
          document.getElementById("description").value = "";
          document.getElementById("projectFile").value = "";

          showStatus("Project uploaded and saved successfully!");
        } catch (error) {
          showStatus(
            error.message || "Project upload failed.",
            true
          );
        } finally {
          button.disabled = false;
        }
      }
    );

    // LOGOUT
    document.getElementById("logoutBtn").addEventListener(
      "click",
      async () => {
        const { error } = await supabaseClient.auth.signOut();

        if (error) {
          showStatus(error.message, true);
          return;
        }

        await updateScreen();
        showStatus("Logged out successfully.");
      }
    );

    // INITIALIZE
    updateScreen();
  </script>
</body>
</html>
