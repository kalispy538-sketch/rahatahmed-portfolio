<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahat Ahmed | Portfolio Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#edf3fa;color:#101d35;font-family:Arial,sans-serif}
.container{max-width:760px;margin:35px auto;padding:25px;background:white;border-radius:12px}
h1,h2{color:#14284b}
label{display:block;font-weight:bold;margin:16px 0 7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:7px;font-size:14px}
textarea{min-height:90px;resize:vertical}
button{padding:12px 18px;border:0;border-radius:7px;background:#2864ed;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.full{width:100%;margin-top:18px}
.secondary{background:#475569}
.danger{background:#dc2626}
.card{border:1px solid #dce4ef;padding:15px;border-radius:9px;margin-top:12px}
.card img{max-width:180px;border-radius:7px;margin-top:8px}
.message{padding:12px;background:#eff6ff;border-radius:7px;margin-top:12px;overflow-wrap:anywhere}
.hidden{display:none}
.small{font-size:12px;color:#64748b;line-height:1.5}
</style>
</head>

<body>
<div class="container">

<h1>RAHAT. Admin Panel</h1>

<section id="loginSection">
<h2>Admin Login</h2>

<label>Email</label>
<input id="email" type="email" placeholder="Admin email">

<label>Password</label>
<input id="password" type="password" placeholder="Password">

<button class="full" id="loginBtn" onclick="login()">Login</button>
<div id="loginMessage" class="message hidden"></div>
</section>

<section id="adminSection" class="hidden">

<button class="secondary" onclick="logout()">Logout</button>

<h2>Upload New Project</h2>

<label>Project Title *</label>
<input id="title" placeholder="Project title">

<label>Category *</label>
<select id="category">
<option value="">Select Category</option>
<option>AI Development</option>
<option>Excel & Google Sheets</option>
<option>Data Entry & Management</option>
<option>Graphic Design</option>
<option>Video Editing</option>
<option>Office Productivity</option>
</select>

<label>Description</label>
<textarea id="description" placeholder="Project description"></textarea>

<label>YouTube Video Link (optional)</label>
<input id="youtube" placeholder="https://youtu.be/VIDEO_ID" oninput="previewYoutube()">
<p class="small">Paste a YouTube link. Its thumbnail will appear automatically.</p>
<div id="youtubePreview"></div>

<label>Preview Image (optional)</label>
<input id="previewFile" type="file" accept="image/jpeg,image/png,image/webp">

<label>Project File (optional)</label>
<input id="projectFile" type="file">

<p class="small">Maximum 50 MB per file. YouTube projects do not need a separate video upload.</p>

<button class="full" id="uploadBtn" onclick="uploadProject()">Upload Project</button>

<div id="uploadMessage" class="message hidden"></div>

<hr style="margin:30px 0;border:0;border-top:1px solid #ddd">

<h2>Manage Existing Projects</h2>
<button class="secondary" onclick="loadProjects()">Refresh Projects</button>
<div id="projectList"></div>

</section>
</div>

<script>
const SUPABASE_URL = "https://inaazsmabgptpjckugwn.supabase.co";
const SUPABASE_KEY = "sb_publishable_yBaRrATND_tJx4JXsIPAyA__LggH--V";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "portfolio-projects";

function showMessage(id,message){
 const el=document.getElementById(id);
 el.textContent=message;
 el.classList.remove("hidden");
}

function getYoutubeId(url){
 try{
  const u=new URL(url);
  if(u.hostname==="youtu.be") return u.pathname.slice(1).split("/")[0];
  if(u.hostname.includes("youtube.com")){
   if(u.pathname==="/watch") return u.searchParams.get("v");
   const parts=u.pathname.split("/");
   if(["embed","shorts","live"].includes(parts[1])) return parts[2];
  }
 }catch(e){}
 return null;
}

function previewYoutube(){
 const url=document.getElementById("youtube").value.trim();
 const id=getYoutubeId(url);
 const box=document.getElementById("youtubePreview");

 box.innerHTML=id
 ? `<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" style="width:100%;max-width:360px;border-radius:9px">`
 : "";
}

async function login(){
 const btn=document.getElementById("loginBtn");
 btn.disabled=true;
 document.getElementById("loginMessage").classList.add("hidden");

 const {data,error}=await db.auth.signInWithPassword({
  email:document.getElementById("email").value.trim(),
  password:document.getElementById("password").value
 });

 btn.disabled=false;

 if(error){
  showMessage("loginMessage","Login failed: "+error.message);
  return;
 }

 showAdmin();
}

async function logout(){
 await db.auth.signOut();
 document.getElementById("adminSection").classList.add("hidden");
 document.getElementById("loginSection").classList.remove("hidden");
}

function showAdmin(){
 document.getElementById("loginSection").classList.add("hidden");
 document.getElementById("adminSection").classList.remove("hidden");
 loadProjects();
}

async function uploadToStorage(file){
 const ext=file.name.split(".").pop();
 const path=Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;

 const {error}=await db.storage.from(BUCKET).upload(path,file,{
  upsert:false
 });

 if(error) throw error;

 const {data}=db.storage.from(BUCKET).getPublicUrl(path);
 return {url:data.publicUrl,path:path};
}

async function uploadProject(){
 const btn=document.getElementById("uploadBtn");
 const message=document.getElementById("uploadMessage");

 message.classList.add("hidden");

 const title=document.getElementById("title").value.trim();
 const category=document.getElementById("category").value;
 const description=document.getElementById("description").value.trim();
 const youtubeUrl=document.getElementById("youtube").value.trim();
 const youtubeId=youtubeUrl ? getYoutubeId(youtubeUrl) : null;

 const previewFile=document.getElementById("previewFile").files[0];
 const projectFile=document.getElementById("projectFile").files[0];

 if(!title || !category){
  showMessage("uploadMessage","Please enter project title and category.");
  return;
 }

 if(youtubeUrl && !youtubeId){
  showMessage("uploadMessage","Please enter a valid YouTube link.");
  return;
 }

 if(!youtubeUrl && !previewFile && !projectFile){
  showMessage("uploadMessage","Add a YouTube link, preview image, or project file.");
  return;
 }

 for(const f of [previewFile,projectFile]){
  if(f && f.size>50*1024*1024){
   showMessage("uploadMessage","File size must be 50 MB or less.");
   return;
  }
 }

 btn.disabled=true;
 btn.textContent="Uploading...";

 try{
  let previewUrl=null;
  let projectUrl=null;
  let projectPath=null;
  let previewPath=null;

  if(previewFile){
   const result=await uploadToStorage(previewFile);
   previewUrl=result.url;
   previewPath=result.path;
  }

  if(projectFile){
   const result=await uploadToStorage(projectFile);
   projectUrl=result.url;
   projectPath=result.path;
  }

  const youtubeThumbnail=youtubeId
   ? "https://img.youtube.com/vi/"+youtubeId+"/hqdefault.jpg"
   : null;

  // file_url must never be NULL
  const finalFileUrl=previewUrl || youtubeThumbnail || projectUrl;

  if(!finalFileUrl){
   throw new Error("A preview image, YouTube link, or project file is required.");
  }

  const record={
   title:title,
   category:category,
   description:description,
   file_url:finalFileUrl,
   workbook_url:projectUrl,
   project_file_url:projectUrl,
   project_file_name:projectFile ? projectFile.name : null,
   youtube_url:youtubeUrl || null
  };

  const {error}=await db.from("projects").insert([record]);

  if(error) throw error;

  showMessage("uploadMessage","Project uploaded successfully!");

  document.getElementById("title").value="";
  document.getElementById("category").value="";
  document.getElementById("description").value="";
  document.getElementById("youtube").value="";
  document.getElementById("previewFile").value="";
  document.getElementById("projectFile").value="";
  document.getElementById("youtubePreview").innerHTML="";

  loadProjects();

 }catch(error){
  showMessage("uploadMessage","Upload failed: "+error.message);
 }finally{
  btn.disabled=false;
  btn.textContent="Upload Project";
 }
}

async function loadProjects(){
 const list=document.getElementById("projectList");
 list.innerHTML="Loading projects...";

 const {data,error}=await db
  .from("projects")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  list.textContent="Error: "+error.message;
  return;
 }

 list.innerHTML="";

 if(!data || data.length===0){
  list.textContent="No projects found.";
  return;
 }

 data.forEach(project=>{
  const div=document.createElement("div");
  div.className="card";

  const heading=document.createElement("h3");
  heading.textContent=project.title;

  const category=document.createElement("p");
  category.textContent=project.category;

  const description=document.createElement("p");
  description.textContent=project.description || "";

  div.append(heading,category,description);

  if(project.file_url){
   const img=document.createElement("img");
   img.src=project.file_url;
   img.alt=project.title;
   div.appendChild(img);
  }

  if(project.youtube_url){
   const link=document.createElement("p");
   link.textContent="YouTube video linked";
   div.appendChild(link);
  }

  const deleteBtn=document.createElement("button");
  deleteBtn.className="danger";
  deleteBtn.textContent="Delete Project";
  deleteBtn.onclick=()=>deleteProject(project.id);

  div.appendChild(deleteBtn);
  list.appendChild(div);
 });
}

async function deleteProject(id){
 if(!confirm("Are you sure you want to delete this project?")) return;

 const {error}=await db.from("projects").delete().eq("id",id);

 if(error){
  alert("Delete failed: "+error.message);
  return;
 }

 alert("Project deleted.");
 loadProjects();
}

db.auth.getSession().then(({data})=>{
 if(data.session) showAdmin();
});
</script>
</body>
</html>
