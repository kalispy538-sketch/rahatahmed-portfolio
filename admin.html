
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahat Ahmed | Portfolio Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#eef3f9;color:#10203a;font-family:Arial,sans-serif}
main{max-width:850px;margin:20px auto;background:white;padding:26px;border-radius:16px;box-shadow:0 8px 30px #14213d12}
h1{font-size:27px;margin-top:0}
h2{font-size:21px;margin-top:28px}
label{display:block;font-weight:bold;margin:14px 0 7px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:7px;font-size:14px;background:white}
textarea{min-height:85px;resize:vertical}
button{padding:12px 16px;border:0;border-radius:7px;cursor:pointer;font-weight:bold}
.primary{background:#2864ed;color:white;width:100%;margin-top:18px}
.secondary{background:#475569;color:white}
.danger{background:#dc2626;color:white}
.project{border:1px solid #dbe3ef;border-radius:10px;padding:15px;margin-top:12px}
.project-title{font-size:17px;font-weight:bold;overflow-wrap:anywhere}
.meta{font-size:13px;color:#64748b;margin:7px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
.notice{padding:12px;border-radius:8px;background:#eff6ff;margin-top:12px;font-size:14px;overflow-wrap:anywhere}
.hidden{display:none!important}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
.small{font-size:13px;color:#64748b;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>Portfolio Admin</h1>
<p>Rahat Ahmed — Manage your portfolio projects.</p>

<section id="loginPanel">
<h2>Admin Login</h2>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" autocomplete="username" required>
<label>Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button class="primary" type="submit">Login</button>
</form>
</section>

<section id="adminPanel" class="hidden">
<div class="actions">
<button class="secondary" id="logoutBtn" type="button">Logout</button>
</div>

<h2>Upload New Project</h2>
<form id="uploadForm">
<label>Project Title</label>
<input id="title" required placeholder="Example: Excel Sales Dashboard">

<label>Project Category</label>
<select id="category" required>
<option>AI Development</option>
<option>Excel &amp; Google Sheets</option>
<option>Data Entry &amp; Management</option>
<option>Graphic Design</option>
<option>Video Editing</option>
<option>Office Productivity</option>
</select>

<label>Project Description</label>
<textarea id="description" placeholder="Describe your project"></textarea>

<label>Preview Image (optional)</label>
<input id="preview" type="file" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp">

<label>Project File (optional)</label>
<input id="projectFile" type="file" accept=".xlsx,.csv,.pdf,.docx,.pptx,.py,.ipynb,.mp4,.png,.jpg,.jpeg,.webp,.zip,.txt">

<p class="small">Maximum 50 MB per file. Select a preview image and/or a project file. Uploads must match the file types allowed in your Supabase Storage bucket.</p>
<button class="primary" type="submit" id="uploadBtn">Upload Project</button>
</form>

<div class="notice" id="status">Login to manage projects.</div>

<h2>Manage Existing Projects</h2>
<label>Filter by Category</label>
<select id="filterCategory">
<option value="ALL">All Categories</option>
<option>AI Development</option>
<option>Excel &amp; Google Sheets</option>
<option>Data Entry &amp; Management</option>
<option>Graphic Design</option>
<option>Video Editing</option>
<option>Office Productivity</option>
</select>

<div id="projectCount" class="small"></div>
<div id="projectList"></div>
</section>
</main>

<script>
const SUPABASE_URL = "https://inaazsmabgptpjckugwn.supabase.co";
const SUPABASE_KEY = "sb_publishable_yBaRrATND_tJx4JXsIPAyA__LggH--V";
const BUCKET = "portfolio-projects";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let projects = [];

function status(message) {
  $("status").textContent = message;
}

function safeText(value) {
  return String(value || "");
}

function escapeHTML(value) {
  return safeText(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function showAdmin(isLoggedIn) {
  $("loginPanel").classList.toggle("hidden", isLoggedIn);
  $("adminPanel").classList.toggle("hidden", !isLoggedIn);
  if (isLoggedIn) loadProjects();
}

async function checkSession() {
  const {data, error} = await db.auth.getSession();
  if (error) status(error.message);
  showAdmin(!!data.session);
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  status("Logging in...");
  const {error} = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });
  if (error) {
    status("Login failed: " + error.message);
    return;
  }
  status("Login successful.");
  showAdmin(true);
});

$("logoutBtn").addEventListener("click", async () => {
  const {error} = await db.auth.signOut();
  if (error) status("Logout failed: " + error.message);
  showAdmin(false);
  status(error ? error.message : "Logged out.");
});

db.auth.onAuthStateChange((_event, session) => {
  showAdmin(!!session);
});

function safeFileName(name) {
  return name.normalize("NFKD")
    .replace(/[^\w.-]+/g, "_")
    .replace(/^_+|_+$/g, "") || "file";
}

async function uploadFile(file, folder) {
  if (!file) return null;
  if (file.size > 50 * 1024 * 1024) {
    throw new Error(file.name + " is larger than 50 MB.");
  }
  const path = folder + "/" + Date.now() + "_" +
    Math.random().toString(36).slice(2, 9) + "_" +
    safeFileName(file.name);

  const {error} = await db.storage.from(BUCKET).upload(path, file, {
    upsert: false,
    contentType: file.type || "application/octet-stream"
  });
  if (error) throw error;

  const {data} = db.storage.from(BUCKET).getPublicUrl(path);
  return {url: data.publicUrl, path, name: file.name};
}

function filePathFromUrl(url) {
  if (!url) return null;
  try {
    const parsed = new URL(url);
    const marker = "/storage/v1/object/public/" + BUCKET + "/";
    const index = parsed.pathname.indexOf(marker);
    if (index === -1) return null;
    return decodeURIComponent(parsed.pathname.slice(index + marker.length));
  } catch (_) {
    return null;
  }
}

async function deleteStoredFile(url) {
  const path = filePathFromUrl(url);
  if (!path) return;
  const {error} = await db.storage.from(BUCKET).remove([path]);
  if (error) throw error;
}

$("uploadForm").addEventListener("submit", async event => {
  event.preventDefault();
  const title = $("title").value.trim();
  const category = $("category").value;
  const description = $("description").value.trim();
  const preview = $("preview").files[0];
  const projectFile = $("projectFile").files[0];

  if (!preview && !projectFile) {
    status("Choose a preview image or a project file.");
    return;
  }

  $("uploadBtn").disabled = true;
  status("Uploading files... Please wait.");

  let uploadedPreview = null;
  let uploadedProject = null;

  try {
    if (preview) uploadedPreview = await uploadFile(preview, "previews");
    if (projectFile) uploadedProject = await uploadFile(projectFile, "projects");

    const ext = projectFile ? projectFile.name.split(".").pop().toLowerCase() : "";
    const record = {
      title,
      category,
      description,
      file_url: uploadedPreview ? uploadedPreview.url : null,
      workbook_url: ext === "xlsx" && uploadedProject ? uploadedProject.url : null,
      project_file_url: uploadedProject ? uploadedProject.url : null,
      project_file_name: uploadedProject ? uploadedProject.name : null
    };

    const {error} = await db.from("projects").insert(record);
    if (error) throw error;

    status("Project uploaded successfully!");
    $("uploadForm").reset();
    await loadProjects();
  } catch (error) {
    status("Upload failed: " + (error.message || String(error)) +
      "\nIf a file was uploaded before the error, it may remain in Storage.");
  } finally {
    $("uploadBtn").disabled = false;
  }
});

$("filterCategory").addEventListener("change", renderProjects);

async function loadProjects() {
  $("projectList").innerHTML = "";
  $("projectCount").textContent = "Loading projects...";

  const {data, error} = await db.from("projects")
    .select("id,title,category,description,file_url,workbook_url,project_file_url,project_file_name,created_at")
    .order("created_at", {ascending: false});

  if (error) {
    $("projectCount").textContent = "";
    status("Could not load projects: " + error.message);
    return;
  }

  projects = data || [];
  renderProjects();
}

function renderProjects() {
  const filter = $("filterCategory").value;
  const shown = filter === "ALL"
    ? projects
    : projects.filter(p => p.category === filter);

  $("projectCount").textContent = shown.length + " project(s)";
  $("projectList").innerHTML = "";

  if (!shown.length) {
    $("projectList").innerHTML = "<p>No projects in this category.</p>";
    return;
  }

  shown.forEach(project => {
    const card = document.createElement("div");
    card.className = "project";

    const title = document.createElement("div");
    title.className = "project-title";
    title.textContent = project.title || "Untitled project";

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (project.category || "Uncategorized") +
      (project.created_at ? " • " + new Date(project.created_at).toLocaleDateString() : "");

    const desc = document.createElement("p");
    desc.textContent = project.description || "";

    card.append(title, meta, desc);

    const links = [];
    if (project.file_url) links.push(["Preview image", project.file_url]);
    if (project.project_file_url) {
      links.push([project.project_file_name || "Project file", project.project_file_url]);
    } else if (project.workbook_url) {
      links.push(["Excel workbook", project.workbook_url]);
    }

    links.forEach(([label, url]) => {
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Open " + label;
      a.style.marginRight = "14px";
      card.appendChild(a);
    });

    const actions = document.createElement("div");
    actions.className = "actions";
    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "Delete Project";
    del.addEventListener("click", () => deleteProject(project));
    actions.appendChild(del);
    card.appendChild(actions);
    $("projectList").appendChild(card);
  });
}

async function deleteProject(project) {
  const name = project.title || "this project";
  if (!confirm('Delete "' + name + '"?\nThe project record and linked files will be deleted.')) return;

  status("Deleting project...");
  const {data: sessionData} = await db.auth.getSession();
  if (!sessionData.session) {
    status("Your session expired. Please log in again.");
    showAdmin(false);
    return;
  }

  try {
    // Remove database record first. If this fails, keep the files.
    const {error: rowError} = await db.from("projects")
      .delete()
      .eq("id", project.id);
    if (rowError) throw rowError;

    // Delete linked files from Storage where the URL belongs to this bucket.
    const urls = [...new Set([
      project.file_url,
      project.workbook_url,
      project.project_file_url
    ].filter(Boolean))];

    const results = await Promise.allSettled(urls.map(deleteStoredFile));
    const failed = results.filter(r => r.status === "rejected");

    await loadProjects();

    if (failed.length) {
      status("Project record deleted, but one or more Storage files could not be deleted. Check Storage policies and bucket URLs.");
    } else {
      status("Project and linked Storage files deleted successfully.");
    }
  } catch (error) {
    status("Delete failed: " + (error.message || String(error)));
  }
}

checkSession();
</script>
</body>
</html>
