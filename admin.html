
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Admin | Rahat Ahmed</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:25px 15px;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
.container{max-width:650px;margin:auto;padding:25px;background:white;border-radius:14px}
label{display:block;margin-top:16px;font-weight:bold}
input,select,textarea{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #cbd5e1;border-radius:7px}
textarea{min-height:90px}
button{width:100%;margin-top:18px;padding:13px;background:#2563eb;color:white;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#475569}
.note{padding:12px;background:#eff6ff;border-radius:7px;font-size:13px}
#uploadSection{display:none}
.hidden{display:none!important}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="container">
<h1>Portfolio Admin</h1>
<p>Rahat Ahmed — Manage your portfolio projects.</p>

<section id="loginSection">
<h2>Admin Login</h2>
<label>Admin Email</label>
<input id="email" type="email" autocomplete="username">
<label>Password</label>
<input id="password" type="password" autocomplete="current-password">
<button id="loginBtn">Login</button>
<p class="note">Login with your Supabase Authentication account.</p>
</section>

<section id="uploadSection">
<h2>Upload New Project</h2>

<label>Project Title</label>
<input id="title" placeholder="Example: Excel Sales Dashboard">

<label>Project Category</label>
<select id="category">
<option value="AI Development">AI Development</option>
<option value="Excel & Google Sheets">Excel & Google Sheets</option>
<option value="Data Entry & Management">Data Entry & Management</option>
<option value="Graphic Design">Graphic Design</option>
<option value="Video Editing">Video Editing</option>
<option value="Office Productivity">Office Productivity</option>
</select>

<label>Project Description</label>
<textarea id="description" placeholder="Describe your project"></textarea>

<div id="singleFileGroup">
<label>Select Project File</label>
<input id="projectFile" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,application/pdf">
<p class="note">JPG, PNG, WEBP, MP4 or PDF. Maximum 50 MB.</p>
</div>

<div id="excelFileGroup" class="hidden">
<label>Dashboard Preview Image</label>
<input id="previewFile" type="file" accept="image/jpeg,image/png,image/webp">

<label>Actual Excel Workbook (.xlsx)</label>
<input id="workbookFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">

<p class="note">Select both files. Maximum 50 MB per file.</p>
</div>

<button id="uploadBtn">Upload Project</button>
<button id="logoutBtn" class="secondary">Logout</button>
</section>

<p id="status" role="status"></p>
</main>

<script>
const SUPABASE_URL="https://inaazsmabgptpjckugwn.supabase.co";
const SUPABASE_KEY="sb_publishable_yBaRrATND_tJx4JXsIPAyA__LggH--V";
const XLSX_TYPE="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const MAX_SIZE=50*1024*1024;

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

function showStatus(message,error=false){
  $("status").textContent=message;
  $("status").style.color=error?"#b91c1c":"#166534";
}

function updateFields(){
  const isExcel=$("category").value==="Excel & Google Sheets";
  $("singleFileGroup").classList.toggle("hidden",isExcel);
  $("excelFileGroup").classList.toggle("hidden",!isExcel);
  $("projectFile").required=!isExcel;
  $("previewFile").required=isExcel;
  $("workbookFile").required=isExcel;
}

$("category").addEventListener("change",updateFields);

async function updateScreen(){
  const {data,error}=await db.auth.getSession();
  if(error){showStatus(error.message,true);return;}
  const loggedIn=Boolean(data.session);
  $("loginSection").style.display=loggedIn?"none":"block";
  $("uploadSection").style.display=loggedIn?"block":"none";
}

$("loginBtn").addEventListener("click",async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  const button=$("loginBtn");

  if(!email||!password){
    showStatus("Enter your email and password.",true);
    return;
  }

  button.disabled=true;
  showStatus("Logging in...");

  try{
    const {error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    $("password").value="";
    await updateScreen();
    showStatus("Login successful.");
  }catch(error){
    showStatus(error.message,true);
  }finally{
    button.disabled=false;
  }
});

async function uploadFile(file,prefix){
  if(!file)throw new Error("Please select all required files.");
  if(file.size>MAX_SIZE)throw new Error(file.name+" exceeds 50 MB.");

  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=crypto.randomUUID()+"-"+prefix+"-"+safeName;

  const {error}=await db.storage
    .from("portfolio-projects")
    .upload(path,file,{
      cacheControl:"3600",
      upsert:false,
      contentType:file.type ||
        (file.name.toLowerCase().endsWith(".xlsx")?XLSX_TYPE:undefined)
    });

  if(error)throw error;

  return db.storage
    .from("portfolio-projects")
    .getPublicUrl(path).data.publicUrl;
}

$("uploadBtn").addEventListener("click",async()=>{
  const button=$("uploadBtn");
  button.disabled=true;

  try{
    const {data,error}=await db.auth.getSession();
    if(error)throw error;
    if(!data.session)throw new Error("Please log in first.");

    const title=$("title").value.trim();
    const category=$("category").value;
    const description=$("description").value.trim();

    if(!title)throw new Error("Enter project title.");

    let file_url;
    let workbook_url=null;

    if(category==="Excel & Google Sheets"){
      const preview=$("previewFile").files[0];
      const workbook=$("workbookFile").files[0];

      if(!preview||!workbook)
        throw new Error("Select both the preview image and Excel workbook.");

      if(!["image/jpeg","image/png","image/webp"].includes(preview.type))
        throw new Error("Preview must be JPG, PNG or WEBP.");

      if(!(workbook.name.toLowerCase().endsWith(".xlsx")||workbook.type===XLSX_TYPE))
        throw new Error("Workbook must be an .xlsx file.");

      showStatus("Uploading dashboard image...");
      file_url=await uploadFile(preview,"preview");

      showStatus("Uploading Excel workbook...");
      workbook_url=await uploadFile(workbook,"workbook");

    }else{
      const file=$("projectFile").files[0];
      if(!file)throw new Error("Select a project file.");

      if(!["image/jpeg","image/png","image/webp","video/mp4","application/pdf"].includes(file.type))
        throw new Error("Unsupported file type.");

      showStatus("Uploading project...");
      file_url=await uploadFile(file,"project");
    }

    const record={title,category,description,file_url};
    if(workbook_url)record.workbook_url=workbook_url;

    showStatus("Saving project details...");
    const {error:saveError}=await db.from("projects").insert(record);

    if(saveError)
      throw new Error("Database save failed: "+saveError.message);

    $("title").value="";
    $("description").value="";
    $("projectFile").value="";
    $("previewFile").value="";
    $("workbookFile").value="";

    showStatus("Project uploaded successfully!");

  }catch(error){
    showStatus(error.message||"Upload failed.",true);
  }finally{
    button.disabled=false;
  }
});

$("logoutBtn").addEventListener("click",async()=>{
  const {error}=await db.auth.signOut();
  if(error){showStatus(error.message,true);return;}
  await updateScreen();
  showStatus("Logged out successfully.");
});

updateFields();
updateScreen();
</script>
</body>
</html>
